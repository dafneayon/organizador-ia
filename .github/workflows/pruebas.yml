name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    # macOS: la herramienta usa xattr (etiquetas de Finder), mdls, PDFKit y Vision
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis
        run: |
          /usr/bin/python3 -m py_compile herramienta.py extraer.py rasgos.py catalogo.py entrenar.py busqueda.py mcp_servidor.py evals/evaluar_busqueda.py
          zsh -n organizador
      - name: Compilar lector de PDF
        run: mkdir -p bin && swiftc -O -o bin/pdf_texto pdf_texto.swift
      - name: Dependencias de entrenamiento
        run: /usr/bin/python3 -m venv .venv && .venv/bin/pip install -r requirements-entrenamiento.txt
      # La búsqueda se prueba con palabras clave (sin descargar el modelo de embeddings);
      # la calidad con embeddings se mide localmente con evals/evaluar_busqueda.py
      - name: Pruebas de seguridad, clasificador, búsqueda y MCP
        run: /usr/bin/python3 -m unittest discover -s tests -v
